
name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract unchanged charts from original PDF
        run: |
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf = fitz.open("assets/ECON_108_Rumination_Response_Spectral-1.pdf")
          for page_index, filename in [(1, "welfare-chart.png"), (2, "expenditures-chart.png")]:
              images = pdf[page_index].get_images(full=True)
              assert len(images) == 1, f"Unexpected image count on page {page_index + 1}"
              image = pdf.extract_image(images[0][0])
              assert image["ext"] == "png", "Expected original PNG chart"
              Path("assets", filename).write_bytes(image["image"])
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
